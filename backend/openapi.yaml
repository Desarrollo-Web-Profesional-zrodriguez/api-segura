openapi: 3.0.3
info:
  title: Task Manager API
  version: 1.0.0
servers:
  - url: http://localhost:3000/api/v1
paths:
  /auth/register:
    post:
      summary: Register a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
      responses:
        "201":
          description: Account created and initial token pair issued
        "400":
          description: Validation error
        "409":
          description: Email conflict
  /auth/login:
    post:
      summary: Login to account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Authentication successful
        "401":
          description: Invalid credentials
  /auth/refresh:
    post:
      summary: Rotate refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: New token pair issued
        "401":
          description: Invalid, expired, or revoked refresh token
  /auth/logout:
    post:
      summary: Revoke refresh token family
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "204":
          description: Family revoked successfully
  /auth/logout-all:
    post:
      summary: Revoke all refresh tokens for current user
      security:
        - bearerAuth: []
      responses:
        "204":
          description: All sessions revoked
  /tasks:
    get:
      summary: List current user tasks
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Current user's paginated tasks
        "401":
          description: Missing or invalid access token
    post:
      summary: Create a new task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  maxLength: 120
                description:
                  type: string
                  maxLength: 2000
      responses:
        "201":
          description: Task created
        "400":
          description: Invalid request
        "401":
          description: Missing or invalid access token
  /tasks/{taskId}:
    patch:
      summary: Update task
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Task updated
        "404":
          description: Task not found or not owned
    delete:
      summary: Delete task
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Task deleted
        "404":
          description: Task not found or not owned
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
